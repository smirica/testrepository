name: Deploy Reading Gator Container App

# When this action will be executed
on:
  # Automatically trigger it when detected changes in the container service
  push:
    branches: 
      [ main ]
    paths:
    - 'container/**'
    - '.github/workflows/deploy-container-app.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.MCPTOOLKITAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.MCPTOOLKITAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.MCPTOOLKITAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/container
          dockerfilePath: Dockerfile
          registryUrl: mcptoolkitacrmcrqsxaxvfqiu.azurecr.io
          registryUsername: ${{ secrets.MCPTOOLKITAPP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.MCPTOOLKITAPP_REGISTRY_PASSWORD }}
          containerAppName: reading-gator-containerapp
          resourceGroup: foundry-resource-ingestion
          imageToBuild: mcptoolkitacrmcrqsxaxvfqiu.azurecr.io/reading-gator-containerapp:${{ github.sha }}

